<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GW-PROJECT — Daftar</title><link rel="stylesheet" href="style.css"><script>fetch('style.css',{cache:'no-store'}).then(r=>r.text()).then(css=>{const s=document.createElement('style');s.textContent=css;document.head.appendChild(s)}).catch(()=>{});</script></head><body class="login-page"><div class="grid"></div><main class="login-card"><div class="brand"><div class="brand-icon">GW</div><div><div class="brand-name">GW<span>-PROJECT</span></div><div class="brand-sub">MEMBER REGISTRATION</div></div></div><div class="eyebrow">&gt; REQUEST ACCESS</div><h1>Buat akun.</h1><p>Setelah mendaftar, akun akan berstatus <b>pending</b> sampai disetujui administrator.</p><form id="registerForm"><label>Username<input id="username" required minlength="3" maxlength="30" placeholder="Username"></label><label>Password<input id="password" type="password" required minlength="6" placeholder="Minimal 6 karakter"></label><label>Konfirmasi Password<input id="confirm" type="password" required minlength="6" placeholder="Ulangi password"></label><button class="login-btn">AJUKAN PENDAFTARAN →</button><div id="msg" class="error"></div></form><div class="auth-link">Sudah punya akun? <a href="login.html">Kembali ke login</a></div></main><script>document.getElementById('registerForm').addEventListener('submit',e=>{e.preventDefault();const username=document.getElementById('username').value.trim();const password=document.getElementById('password').value;const confirm=document.getElementById('confirm').value;const msg=document.getElementById('msg');let users=JSON.parse(localStorage.getItem('gw_users')||'[]');if(password!==confirm){msg.textContent='Konfirmasi password tidak cocok.';return}if(users.some(x=>x.username.toLowerCase()===username.toLowerCase())||username.toLowerCase()==='admin'){msg.textContent='Username sudah digunakan.';return}users.push({username,password,status:'pending',createdAt:new Date().toISOString()});localStorage.setItem('gw_users',JSON.stringify(users));alert('Pendaftaran berhasil. Tunggu persetujuan admin.');location.href='login.html'});</script></body></html>
