<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GW-PROJECT — Login</title><link rel="stylesheet" href="style.css"></head><body class="login-page"><div class="grid"></div><main class="login-card"><div class="brand"><div class="brand-icon">⌕</div><div><div class="brand-name">GW<span>-PROJECT</span></div><div class="brand-sub">SECURE DATA INTELLIGENCE</div></div></div><div class="eyebrow">&gt; AUTHENTICATION REQUIRED</div><h1>Welcome back.</h1><p>Masuk untuk mengakses workspace dan tools GW-PROJECT.</p><form id="loginForm"><label>Username<input id="username" autocomplete="username" required placeholder="Masukkan username"></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Masukkan password"></label><button class="login-btn">MASUK →</button><div id="error" class="error"></div></form><div class="demo">Demo sementara: <b>admin</b> / <b>admin123</b><br>Untuk production, auth wajib dipindahkan ke backend.</div></main><script>document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;if(u==='admin'&&p==='admin123'){sessionStorage.setItem('gw_auth','1');sessionStorage.setItem('gw_user',u);location.href='dashboard.html'}else document.getElementById('error').textContent='Username atau password salah.'});</script></body></html>
