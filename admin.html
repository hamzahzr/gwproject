<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GW-PROJECT — Admin</title><style>:root{--bg:#050506;--line:#2b171c;--red:#ff263f;--text:#f7f7f8;--muted:#858993;--green:#40df88;--amber:#ffbd4a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(255,38,63,.13),transparent 35%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}.top{height:70px;padding:12px 4%;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#070709ee;position:sticky;top:0;z-index:5}.brand{display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border:1px solid var(--red);display:grid;place-items:center;color:var(--red);font:900 12px monospace}.name{font-weight:900}.name span{color:var(--red)}.sub,.ey{font:700 9px monospace;letter-spacing:2px;color:var(--red)}nav{display:flex;gap:18px;align-items:center}nav a{color:#999da6;text-decoration:none;font:700 10px monospace}nav a:hover,nav a.on{color:var(--red)}.exit{background:none;border:1px solid var(--line);color:#bbb;padding:8px 12px;border-radius:7px;font:700 10px monospace}.wrap{max-width:1200px;margin:auto;padding:38px 22px 70px}.ey{margin-bottom:10px}.title{font-size:clamp(42px,7vw,70px);letter-spacing:-4px;margin:0 0 12px}.accent{color:var(--red)}.muted{color:var(--muted);line-height:1.7}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.stat,.panel{border:1px solid var(--line);background:linear-gradient(145deg,#111116,#08080a);border-radius:12px}.stat{padding:16px}.stat small{color:var(--red);font:700 9px monospace}.stat strong{display:block;font-size:23px;margin-top:7px}.panel{padding:20px;margin-top:15px}.head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:13px}.label{font:800 10px monospace;letter-spacing:1.5px}.badge{color:var(--red);font:700 9px monospace}.tablewrap{overflow:auto;margin-top:18px}.table{width:100%;border-collapse:collapse;min-width:820px}.table th,.table td{padding:13px;text-align:left;border-bottom:1px solid var(--line);font-size:11px}.table th{color:#9da1aa;font:700 9px monospace}.pending{color:var(--amber)}.approved{color:var(--green)}.rejected{color:#ff6978}.role-admin{color:var(--red);font-weight:800}.role-user{color:#b7bac2}.action{border:1px solid #54242b;background:#170c0f;color:#ff8792;border-radius:7px;padding:7px 10px;cursor:pointer;margin:2px}.action:hover{background:#281014}.action.role{color:#fff}.empty{text-align:center;color:var(--muted);padding:30px}@media(max-width:600px){nav a{display:none}.stats{grid-template-columns:1fr}.panel{padding:14px}}
</style></head><body><script>if(sessionStorage.getItem('gw_auth')!=='1'||sessionStorage.getItem('gw_role')!=='admin')location.href='login.html'</script><header class="top"><div class="brand"><div class="logo">GW</div><div><div class="name">GW<span>-PROJECT</span></div><div class="sub">ADMIN CONTROL CENTER</div></div></div><nav><a href="dashboard.html">CENTER</a><a href="tools.html">TOOLS</a><a href="admin.html" class="on">ADMIN</a><button class="exit" id="exit">EXIT</button></nav></header><main class="wrap"><div class="ey">&gt; ADMIN / ACCESS CONTROL</div><h1 class="title">Control <span class="accent">Center.</span></h1><p class="muted">Kelola pengguna, persetujuan akses, dan role akun.</p><div class="stats"><div class="stat"><small>TOTAL USERS</small><strong id="total">0</strong></div><div class="stat"><small>PENDING</small><strong id="pending">0</strong></div><div class="stat"><small>APPROVED</small><strong id="approved">0</strong></div></div><section class="panel"><div class="head"><span class="label">USER ACCESS CONTROL</span><span class="badge">ADMIN ONLY</span></div><div class="tablewrap"><table class="table"><thead><tr><th>USERNAME</th><th>REGISTERED</th><th>STATUS</th><th>ROLE</th><th>ACTION</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>const key='gw_users';const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));function load(){const users=JSON.parse(localStorage.getItem(key)||'[]');total.textContent=users.length;pending.textContent=users.filter(x=>x.status==='pending').length;approved.textContent=users.filter(x=>x.status==='approved').length;rows.innerHTML=users.length?users.map((u,i)=>{const role=u.role==='admin'?'admin':'user';return `<tr><td><b>${esc(u.username)}</b></td><td>${new Date(u.createdAt).toLocaleString('id-ID')}</td><td class="${u.status}">${String(u.status||'pending').toUpperCase()}</td><td class="role-${role}">${role.toUpperCase()}</td><td>${u.status==='pending'?`<button class="action" onclick="setStatus(${i},'approved')">SETUJUI</button> <button class="action" onclick="setStatus(${i},'rejected')">TOLAK</button>`:''}${u.status==='approved'?`<button class="action role" onclick="setRole(${i},'${role==='admin'?'user':'admin'}')">JADIKAN ${role==='admin'?'USER':'ADMIN'}</button>`:'—'}</td></tr>`}).join(''):'<tr><td colspan="5" class="empty">Belum ada pendaftaran.</td></tr>'}function setStatus(i,status){const u=JSON.parse(localStorage.getItem(key)||'[]');if(u[i])u[i].status=status;localStorage.setItem(key,JSON.stringify(u));load()}function setRole(i,role){const u=JSON.parse(localStorage.getItem(key)||'[]');if(!u[i]||u[i].status!=='approved')return;if(!confirm(`Ubah role ${u[i].username} menjadi ${role.toUpperCase()}?`))return;u[i].role=role;localStorage.setItem(key,JSON.stringify(u));load()}exit.onclick=()=>{sessionStorage.clear();location.href='login.html'};load();</script></body></html>
