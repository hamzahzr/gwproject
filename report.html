<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GW-PROJECT — Report</title><style>:root{--bg:#050506;--line:#2b171c;--red:#ff263f;--text:#f7f7f8;--muted:#858993;--green:#40df88}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(255,38,63,.13),transparent 35%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}.top{height:70px;padding:12px 4%;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#070709ee;position:sticky;top:0}.brand{display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border:1px solid var(--red);display:grid;place-items:center;color:var(--red);font:900 12px monospace}.name{font-weight:900}.name span{color:var(--red)}.sub,.ey{font:700 9px monospace;letter-spacing:2px;color:var(--red)}nav{display:flex;gap:18px;align-items:center}nav a{color:#999da6;text-decoration:none;font:700 10px monospace}nav a:hover,nav a.on{color:var(--red)}.exit{background:none;border:1px solid var(--line);color:#bbb;padding:8px 12px;border-radius:7px;font:700 10px monospace}.wrap{max-width:1100px;margin:auto;padding:38px 22px}.ey{margin-bottom:10px}.title{font-size:clamp(42px,7vw,70px);letter-spacing:-4px;margin:0 0 12px}.accent{color:var(--red)}.muted{color:var(--muted);line-height:1.7}.panel{margin-top:24px;border:1px solid var(--line);background:linear-gradient(145deg,#111116,#08080a);border-radius:14px;padding:22px}.head{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}.label{font:800 10px monospace;letter-spacing:1.5px}.live{color:var(--green);font:700 9px monospace}.field{margin-top:16px}.field label{display:block;color:#9da1a9;font:700 10px monospace;margin-bottom:7px}.field input,.field textarea{width:100%;padding:13px;background:#060608;border:1px solid var(--line);border-radius:8px;color:#fff;outline:none;font:12px Arial}.field textarea{min-height:150px;resize:vertical}.actions{display:flex;gap:10px;margin-top:14px}.run{border:0;background:var(--red);color:#fff;border-radius:8px;padding:12px 18px;font-weight:900}.secondary{border:1px solid var(--line);background:#0d0d11;color:#ddd;border-radius:8px;padding:12px 18px}@media(max-width:700px){nav a{display:none}.actions{flex-direction:column}}
</style></head><body><script>if(sessionStorage.getItem('gw_auth')!=='1')location.href='login.html'</script><header class="top"><div class="brand"><div class="logo">GW</div><div><div class="name">GW<span>-PROJECT</span></div><div class="sub">REPORT / PDF MODULE</div></div></div><nav><a href="dashboard.html">CENTER</a><a href="tools.html" class="on">TOOLS</a><a href="report.html" class="on">REPORT</a><a id="admin" href="admin.html" style="display:none">ADMIN</a><button class="exit" id="exit">EXIT</button></nav></header><main class="wrap"><div class="ey">&gt; MODULE / 06 / REPORT</div><h1 class="title">Report <span class="accent">Studio.</span></h1><p class="muted">Susun ringkasan hasil pemeriksaan untuk kebutuhan dokumentasi internal.</p><section class="panel"><div class="head"><span class="label">REPORT WORKSPACE</span><span class="live">READY</span></div><div class="field"><label>REPORT TITLE</label><input id="title" placeholder="Judul laporan"></div><div class="field"><label>CONTENT</label><textarea id="content" placeholder="Tulis ringkasan hasil di sini..."></textarea></div><div class="actions"><button class="run" onclick="window.print()">PRINT / SAVE PDF</button><button class="secondary" onclick="document.getElementById('title').value='';document.getElementById('content').value=''">CLEAR</button></div></section></main><script>if(sessionStorage.getItem('gw_role')==='admin')document.getElementById('admin').style.display='inline';document.getElementById('exit').onclick=()=>{sessionStorage.clear();location.href='login.html'};</script></body></html>
